[repo]
name = "open-kioku-repo"
root = "."

[index]
incremental = true
max_file_size = "1mb"
exclude = [
    ".git/**",
    "**/.git/**",
    "node_modules/**",
    "**/node_modules/**",
    "target/**",
    "**/target/**",
    "dist/**",
    "**/dist/**",
    "build/**",
    "**/build/**",
    ".venv/**",
    "**/.venv/**",
    ".ok/**",
    "**/.ok/**",
    "package-lock.json",
    "**/package-lock.json",
    "pnpm-lock.yaml",
    "**/pnpm-lock.yaml",
    "yarn.lock",
    "**/yarn.lock",
    "bun.lockb",
    "**/bun.lockb",
]
resolution_mode = "shadow"

[documents]
enabled = true
plain_text = []

[languages]
enabled = [
    "rust",
    "java",
    "typescript",
    "javascript",
    "python",
    "go",
    "yaml",
    "json",
    "toml",
    "sql",
]

[scip]
enabled = true
mode = "consume"
auto_generate = false
allow_install = false
timeout_seconds = 300
paths = [
    "index.scip",
    ".ok/indexes/go.scip",
    ".ok/indexes/java.scip",
    ".ok/indexes/typescript.scip",
    ".ok/indexes/python.scip",
]

[history]
enabled = true
max_commits = 500
max_files_per_commit = 40

[search]
lexical = "tantivy"
semantic = "disabled"
structural = true

[ranking]
text_relevance = 1.0
exact_reference = 1.0
graph_proximity = 0.3499999940395355
boundary_fit = 0.25
runtime_corroboration = 0.30000001192092896
git_cochange = 0.25
validation_proximity = 1.0
memory_signal = 0.20000000298023224
path_quality = 1.0
semantic_similarity = 0.30000001192092896

[semantic]
enabled = false
backend = "exact-flat"
provider = "local"
model = "local-hash"
dimensions = 384
distance = "cosine"
batch_size = 64
ann_min_rows = 10000
index_symbols = true
index_chunks = true
index_docs = true
index_memory = true
external_provider_allowed = false

[memory]
enabled = false

[runtime]
enabled = false
provider = "sentry"
auth_token_env = "SENTRY_AUTH_TOKEN"

[mcp]
mode = "read-only"
transport = "stdio"
allow_write = false
hide_experimental = false

[security]
redact_secrets = true
deny_network = true
allow_hidden_files = false
allow_write = false
approval_required = true

[commands]
allow = [
    "cargo test",
    "cargo check",
    "mvn test",
    "npm test",
    "pytest",
]

[paths]
deny = [
    ".env",
    ".aws/**",
    ".ssh/**",
    "**/secrets/**",
]

[architecture]
rules = ".ok/architecture-rules.yml"
